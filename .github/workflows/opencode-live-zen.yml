name: OpenCode live Zen gate

"on":
  workflow_dispatch: {}
  push:
    branches:
      - codex/development-2026-09-11
  pull_request:
    branches:
      - codex/development-2026-09-11

permissions:
  contents: read

concurrency:
  group: opencode-live-zen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-opencode:
    name: Real OpenCode + Zen browser gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build production web app
        run: npm run build
        working-directory: web

      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Install pinned real OpenCode
        run: |
          npm install --global opencode-ai@1.18.31
          VERSION="$(opencode --version)"
          echo "OpenCode runtime: $VERSION"
          echo "OPENCODE_TEST_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify Zen secret is available
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          if [ -z "$OPENCODE_ZEN_API_KEY" ]; then
            echo "OPENCODE_ZEN_API_KEY is not configured for this same-repository release gate." >&2
            exit 1
          fi
          echo "Zen credential is configured (value intentionally not printed)."

      - name: Run real OpenCode existing-Session release gate
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: node scripts/native-opencode-process-watch.mjs
        working-directory: web

      - name: Upload sanitized live-runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: opencode-live-zen-${{ github.sha }}
          path: |
            web/browser-artifacts/live-opencode-*.png
            web/browser-artifacts/live-opencode-*.json
          if-no-files-found: warn
          retention-days: 14
